<!doctype html>
<html lang="en" class="dark" data-mode="%MODE%">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Quantum Vault</title>
    <style>
      /*
       * Capacitor iOS shell: full-viewport dark paint with safe-area support.
       */

      html {
        color-scheme: dark;
      }

      html,
      body,
      #root,
      #boot-shell {
        border-radius: 0;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #09090b;
        color: #fafafa;
      }

      /* Pinned so WKWebView cannot scroll the document when inputs focus. */
      body {
        position: fixed;
        inset: 0;
        font-family:
          'thrya-sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      #root {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        overscroll-behavior: none;
        background: #09090b;
      }

      #boot-shell {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background: #09090b;
        box-sizing: border-box;
        pointer-events: none;
        opacity: 0;
        transition: opacity 80ms ease-out;
        animation: boot-shell-reveal 0s linear 650ms forwards;
      }

      html[data-mode='production'] #boot-shell {
        animation-delay: 280ms;
      }

      #boot-shell[data-state='hidden'] {
        animation: none;
        opacity: 0;
      }

      @keyframes boot-shell-reveal {
        to {
          opacity: 1;
        }
      }

      #boot-shell__screen {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100dvh;
        padding: 32px 16px 16px;
        padding-top: calc(32px + env(safe-area-inset-top));
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
        background: #09090b;
        box-sizing: border-box;
      }

      #boot-shell__mark {
        width: 40px;
        height: 40px;
        color: #fafafa;
      }

      #boot-shell__title {
        margin: 32px 0 0;
        font-size: 60px;
        font-weight: 400;
        line-height: 1;
      }

      #boot-shell__footer {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      #boot-shell__actions {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .boot-shell__button {
        height: 44px;
        background: #e4e4e7;
      }

      #boot-shell__copyright {
        margin: 0;
        font-size: 12px;
        line-height: 1.375;
        text-align: center;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <div id="boot-shell" aria-hidden="true">
      <div id="boot-shell__screen">
        <div>
          <svg
            id="boot-shell__mark"
            viewBox="0 0 40 40"
            fill="none"
            aria-hidden="true"
          >
            <rect
              x="1.75"
              y="1.75"
              width="36.5"
              height="36.5"
              rx="3"
              stroke="currentColor"
              stroke-width="2.5"
            />
            <circle
              cx="21"
              cy="20"
              r="9"
              stroke="currentColor"
              stroke-width="2.5"
            />
            <path
              d="M21 11V29M13.2 15.5L28.8 24.5M13.2 24.5L28.8 15.5M6.5 10V14M6.5 26V30"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            />
            <circle cx="21" cy="20" r="3" fill="currentColor" />
          </svg>
          <h1 id="boot-shell__title">Quantum Vault</h1>
        </div>

        <div id="boot-shell__footer">
          <div id="boot-shell__actions">
            <div class="boot-shell__button"></div>
            <div class="boot-shell__button"></div>
          </div>
          <p id="boot-shell__copyright">
            Designed by Lucid Intel Limited, in part an MIT project, Eleven Labs
          </p>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
